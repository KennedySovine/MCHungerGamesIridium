name: HungerGames
main: io.github.KennedySovine.hungerGames.HungerGames
version: 1.1
api-version: 1.20
description: Lightweight HungerGames plugin (skeleton + editor)
authors:
  - KennedySovine

commands:
  hg:
    description: Primary HungerGames command (admin + player subcommands)
    usage: /hg <subcommand>
    aliases: [hungergames]

permissions:
  HungerGames.admin:
    description: Allows use of admin commands (create/edit arenas, start/stop, beacons)
    default: op
  HungerGames.player:
    description: Allows player commands (join/leave)
    default: true

