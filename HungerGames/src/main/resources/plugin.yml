name: HungerGames
version: '1.1.0'
main: io.github.KennedySovine.hungerGames.HungerGames
api-version: '1.21'
description: "HungerGames - Lightweight Hunger Games plugin with multiple arenas, spectating, chest refills and combat logging."
author: KennedySovine

# Primary command: /hg (dispatcher)
commands:
  hg:
    description: HungerGames main command (use /hg <subcommand>)
    aliases: [hungergames]
    usage: /hg <subcommand>
    permission-message: You do not have permission to use HungerGames commands.

# Permission nodes used by the plugin
permissions:
  HungerGames.admin:
    description: Grants access to admin commands (arena creation, editing, start/stop)
    default: op
  HungerGames.player:
    description: Basic permission to use player-facing hg commands (join/leave)
    default: true
  HungerGames.overridecombat:
    description: Exempt from combat-logging rules (use with caution)
    default: op
  HungerGames.gui:
    description: Permission to open the admin GUI (arena editor)
    default: op
  HungerGames.stats.view:
    description: Allow viewing other players' stats (used by /hg stats <player>)
    default: op

# Subcommand reference (this file is the authoritative mapping of command names/usages).
# The plugin uses a single /hg dispatcher; each of the following subcommands should be
# registered by the plugin and enforce the listed permission nodes.
#
# ADMIN SUBCOMMANDS (require HungerGames.admin unless noted)
# /hg arena create <arenaName>
#   Create a new arena id. Stores minimal defaults in arenas.yml and loads it into working memory.
# /hg arena load <arenaName>
#   Load an existing arena into the in-memory working arena. Subsequent admin edits act on that working arena.
# /hg arena addspawn
#   Add a spawn point at your current location for the currently loaded working arena (player-only).
# /hg arena removespawn [index]
#   Remove a spawn by zero-based index from the working arena, or when run by a player with no index, removes the spawn at their location.
# /hg maxplayers <number>
#   Set maximum players allowed in the working arena (no arena id required).
# /hg minplayers <number>
#   Set minimum players required to start (operates on the loaded working arena).
# /hg time <timeInSeconds>
#   Set time before the border begins shrinking (seconds) for the working arena.
# /hg centersize <size>
#   Set final center size (units depend on implementation; typically radius) for the working arena.
# /hg graceperiod <timeInSeconds>
#   Set grace period for out-of-combat disconnects (seconds) for the working arena.
# /hg chestrefill <timeInSeconds>
#   Set chest refill interval for the working arena (seconds).
# /hg start
#   Start a match using the currently loaded working arena.
# /hg stop
#   Stop the currently running match and reset arena state for the working arena.
#
# PLAYER SUBCOMMANDS (default permission: HungerGames.player)
# /hg join <arenaName>
#   Join an arena lobby (players still specify a map to join).
# /hg leave
#   Leave current arena.
# /hg stats [player]
#   View your own or another player's stats. Viewing others requires HungerGames.stats.view.

# Notes for server admins:
# - The plugin persists arena definitions to arenas.yml in the plugin data folder.
# - Combat logging rules: players who disconnect while in recent combat (default 10s)
#   will be considered dead immediately. Players who disconnect while not in combat
#   receive a default 120s grace period before being marked dead. These defaults are
#   configurable in config.yml.
# - GUI support: /hg gui (or via permission HungerGames.gui) will be implemented in the GUI stage.

# End of plugin.yml
