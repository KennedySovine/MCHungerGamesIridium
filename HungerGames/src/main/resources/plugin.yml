name: HungerGames
version: '1.0.0'
main: io.github.KennedySovine.hungerGames.HungerGames
api-version: '1.21'
description: "HungerGames - Lightweight Hunger Games plugin with multiple arenas, spectating, chest refills and combat logging."
author: KennedySovine

# Primary command: /hg (single dispatcher)
commands:
  hg:
    description: HungerGames main command (use /hg <subcommand>)
    aliases: [hungergames]
    usage: /hg <subcommand>
    permission-message: You do not have permission to use HungerGames commands.

# Permission nodes used by the plugin
# Admin node grants access to all admin-style subcommands
permissions:
  HungerGames.admin:
    description: Grants access to all admin-style subcommands
    default: op

  # Granular admin nodes (optional)
  HungerGames.arena.create:
    description: Allows creating new arenas (/hg arena create <name>)
    default: op
  HungerGames.arena.addspawn:
    description: Allows adding a spawn to an arena at current location (/hg arena addspawn <arenaName>)
    default: op
  HungerGames.arena.removespawn:
    description: Allows removing a spawn point by index (/hg arena removespawn <arenaName> <spawnIndex>)
    default: op
  HungerGames.arena.delete:
    description: Allows deleting an existing arena (/hg arena delete <arenaName>)
    default: op

  HungerGames.arena.maxplayers:
    description: Allows changing the max players for an arena (/hg maxplayers <arenaName> <number>)
    default: op
  HungerGames.arena.minplayers:
    description: Allows changing the min players for an arena (/hg minplayers <arenaName> <number>)
    default: op
  HungerGames.arena.time:
    description: Allows changing the pre-deathmatch/shrink timer for an arena (/hg time <arenaName> <seconds>)
    default: op
  HungerGames.arena.centresize:
    description: Allows setting the final center size for the deathmatch border (/hg centresize <arenaName> <size>)
    default: op
  HungerGames.arena.graceperiod:
    description: Allows configuring the out-of-combat grace period (/hg graceperiod <arenaName> <seconds>)
    default: op
  HungerGames.arena.chestrefill:
    description: Allows configuring chest refill interval for an arena (/hg chestrefill <arenaName> <seconds>)
    default: op

  HungerGames.control.start:
    description: Allows forcing a match to start immediately (/hg start <arenaName>)
    default: op
  HungerGames.control.stop:
    description: Allows stopping a running match (/hg stop <arenaName>)
    default: op

  # Player-facing nodes
  HungerGames.player:
    description: Basic permission to use player-facing hg commands (join/leave)
    default: true
  HungerGames.join:
    description: Allows joining an arena (/hg join <arenaName>)
    default: true
  HungerGames.leave:
    description: Allows leaving an arena (/hg leave)
    default: true

  # Stats viewing
  HungerGames.stats.self:
    description: Allow viewing your own post-match stats (/hg stats)
    default: true
  HungerGames.stats.view:
    description: Allow viewing other players' stats (used by /hg stats <player>)
    default: op

  # Combat override (admin)
  HungerGames.overridecombat:
    description: Exempt from combat-logging rules (use with caution)
    default: op

# Subcommand reference (authoritative mapping of subcommands and usages)
# ADMIN SUBCOMMANDS (require HungerGames.admin or granular node listed above)
# /hg arena create <arenaName>
# /hg arena addspawn <arenaName>
# /hg arena removespawn <arenaName> <spawnIndex>
# /hg arena delete <arenaName>
# /hg maxplayers <arenaName> <number>
# /hg minplayers <arenaName> <number>
# /hg time <arenaName> <timeInSeconds>
# /hg centresize <arenaName> <size>
# /hg graceperiod <arenaName> <timeInSeconds>
# /hg chestrefill <arenaName> <timeInSeconds>
# /hg start <arenaName>
# /hg stop <arenaName>

# PLAYER SUBCOMMANDS (default permission: HungerGames.player)
# /hg join <arenaName>
# /hg leave
# /hg stats [player]

# Notes for server admins:
# - The plugin persists arena definitions to arenas.yml in the plugin data folder.
# - Combat logging rules: players who disconnect while in recent combat (default 10s)
#   will be considered dead immediately. Players who disconnect while not in combat
#   receive a default 120s grace period before being marked dead. These defaults are
#   configurable in config.yml.
# - GUI support will be implemented later; admin commands currently do not open GUI.

# End of plugin.yml
