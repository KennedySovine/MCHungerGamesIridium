# HungerGames chest loot configuration.
# Edit plugins/HungerGames/chest-loot.yml on your server to customize loot.
#
# chest-loot has 3 stages:
# - early: used when match starts
# - mid: first refill
# - late: second+ refill
#
# Fields:
# - min-rolls / max-rolls: number of item picks per chest
# - enchant-chance: default enchant chance (0.0-1.0) for entries with enchants
# - items:
#   - material: Bukkit material name
#     min/max: amount range
#     weight: relative rarity (higher = more common)
#     enchant-chance: optional per-item override
#     enchants: optional list "ENCHANT_NAME:level"

