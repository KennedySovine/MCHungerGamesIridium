# HungerGames - Chest loot configuration
#
# This file controls what items are placed into chests during games.
# Keep entries under the 'chest-loot' mapping. Each entry key is a unique
# identifier (for humans) and the contents describe a single loot item.
#
# Fields:
#   material: Bukkit Material name (required) - must match org.bukkit.Material enum
#   min: minimum stack size to place (default 1)
#   max: maximum stack size to place (default equals min)
#   weight: relative weight for weighted random selection (higher = more common)
#   enchants: optional list of enchantment entries in the form ENCHANT_NAME:level
#
# Example (uncomment to use or copy the format into your runtime config):
# chest-loot:
#   starter_apple:
#     material: APPLE
#     min: 1
#     max: 3
#     weight: 10
#   stone_sword:
#     material: STONE_SWORD
#     min: 1
#     max: 1
#     weight: 5
#     enchants:
#       - DAMAGE_ALL:1
#       - KNOCKBACK:2
#   bread:
#     material: BREAD
#     min: 1
#     max: 2
#     weight: 8
#
# Notes:
# - Material names must match Bukkit's Material enum (e.g., DIAMOND_SWORD, APPLE).
# - Weights are used by the ChestLootManager to perform weighted random selection.
# - Enchant names must match Bukkit's Enchantment#getByName values (case-insensitive).
# - Edit the runtime file at plugins/HungerGames/config.yml to make live changes.

# An empty mapping is provided below so the YAML is valid and the plugin can load it.
chest-loot: {}

